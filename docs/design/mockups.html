<!doctype html>
<!-- Design proposal for discussion: static mockups, not the real UI. Rendered to mockups.png. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>FAST — mockups</title>
<style>
  :root {
    --page: #060A14; --navy: #0B1120; --surface: #141E33; --surface-hi: #1E293B; --line: #263247;
    --ice: #F1F5F9; --mist: #94A3B8; --slate: #64748B;
    --electric: #3B82F6; --sky: #60A5FA; --cyan: #22D3EE; --violet: #8B5CF6; --lilac: #A78BFA;
    --magenta: #D946EF; --rose: #FB7185; --rose-deep: #F43F5E; --mint: #34D399;
    --brand: linear-gradient(90deg, var(--cyan), var(--electric) 55%, var(--violet));
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 36px 40px 44px; width: 1760px; background: var(--page); color: var(--ice);
         font-family: 'Segoe UI', 'Rubik', sans-serif; }
  svg { direction: ltr; }
  .num { font-family: Bahnschrift, 'Segoe UI', sans-serif; font-stretch: 78%; font-weight: 700;
         font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .grad { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 8px; display: inline-block; }
  .c.grad, .tile .grad { display: block; }
  h1 { font-size: 15px; letter-spacing: .12em; color: var(--mist); font-weight: 600; margin: 0 0 22px; }
  h1 b { color: var(--sky); font-weight: 700; }
  .row { display: flex; gap: 34px; align-items: flex-start; margin-bottom: 46px; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 14px; font-size: 14px; color: var(--mist); max-width: 318px; }
  figcaption b { display: block; color: var(--ice); font-size: 15px; margin-bottom: 2px; }

  /* Watch: a 300px round face inside a bezel. */
  .watch { width: 300px; height: 300px; border-radius: 50%; background: #000; position: relative;
           box-shadow: 0 0 0 9px #111827, 0 0 0 11px #334155; overflow: hidden; }
  .watch svg.full { position: absolute; inset: 0; }
  .c { position: absolute; left: 0; right: 0; text-align: center; }
  .small { font-size: 13px; color: var(--mist); }
  .pill { display: inline-block; padding: 3px 11px; border-radius: 99px; background: var(--surface-hi); font-size: 12px; color: var(--ice); }
  .state { display: inline-block; padding: 4px 14px; border-radius: 99px; font-size: 14px; font-weight: 700; }
  .zonebar { display: flex; gap: 3px; justify-content: center; direction: ltr; }
  .zonebar i { width: 30px; height: 7px; border-radius: 4px; opacity: .28; }
  .zonebar i.on { opacity: 1; height: 11px; margin-top: -2px; }

  /* Phone */
  .phone { width: 340px; height: 700px; border-radius: 38px; padding: 22px 18px; text-align: right; overflow: hidden;
           background: linear-gradient(180deg, #0B1120, #111C34 55%, #0B1120);
           box-shadow: 0 0 0 8px #111827, 0 0 0 10px #334155; }
  .card { background: var(--surface); border-radius: 20px; padding: 14px 16px; margin-bottom: 10px; }
  .label { font-size: 12px; color: var(--mist); }
  .tiles { display: flex; gap: 8px; margin-bottom: 8px; }
  .tile { flex: 1; background: var(--surface); border-radius: 18px; padding: 11px 12px 9px; }
  .tile .num { font-size: 27px; line-height: 1; display: block; margin-top: 6px; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 99px; background: var(--surface-hi); color: var(--sky); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); }
  .zrow { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 7px; }
  .zrow span:first-child { width: 62px; color: var(--mist); }
  .zrow i { height: 8px; border-radius: 4px; display: block; }
  .zrow .num { font-weight: 500; margin-inline-start: auto; }
  .swatch { display: inline-block; width: 44px; height: 44px; border-radius: 12px; margin-inline-end: 8px; }
</style>
</head>
<body>

<!-- Gradients shared by every inline SVG on the page. -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".3" stop-color="#3B82F6"/><stop offset=".55" stop-color="#8B5CF6"/>
      <stop offset=".78" stop-color="#D946EF"/><stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
  </defs>
</svg>

      </div>
      <div class="tiles">
        <div class="tile"><span class="label">מהירות שיא</span><span class="num grad">27.3</span></div>
        <div class="tile"><span class="label">ממוצע בעבודה</span><span class="num">9.8</span></div>
        <div class="tile"><span class="label">ריצה מהירה</span><span class="num">612m</span></div>
      </div>
      <div class="card" style="padding:12px 10px 8px">
        <div class="label" style="padding:0 6px 4px">מהלך האימון · עבודה ומנוחה</div>
        <svg id="timeline" viewBox="0 0 300 96" width="100%" style="display:block"></svg>
      </div>
      <div class="card">
        <div class="label">זמן בכל אזור מהירות (עבודה בלבד)</div>
        <div class="zrow"><span>הליכה</span><i style="width:38%;background:#22D3EE"></i><span class="num">14:31</span></div>
        <div class="zrow"><span>ג׳וג</span><i style="width:34%;background:#3B82F6"></i><span class="num">13:02</span></div>
        <div class="zrow"><span>ריצה</span><i style="width:19%;background:#8B5CF6"></i><span class="num">7:20</span></div>
        <div class="zrow"><span>מהירה</span><i style="width:7%;background:#D946EF"></i><span class="num">2:34</span></div>
        <div class="zrow"><span>ספרינט</span><i style="width:3%;background:#FB7185"></i><span class="num">0:53</span></div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="label" style="margin-bottom:4px">ספרינטים</div>
        <table>
          <tr><td class="label">#9 · 18:49</td><td class="num" style="text-align:left;font-weight:500">31 m · 4.2 s</td><td class="num" style="text-align:left;color:var(--rose);width:52px">27.3</td></tr>
          <tr><td class="label">#4 · 18:41</td><td class="num" style="text-align:left;font-weight:500">26 m · 3.8 s</td><td class="num" style="text-align:left;width:52px">26.1</td></tr>
        </table>
      </div>
    </div>
    <figcaption><b>אימון כדורגל</b>ציר זמן של עבודה ומנוחה, אזורים ורשימת ספרינטים</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div style="font-size:20px;font-weight:700">שידור חוזר</div>
      <div class="label" style="margin-bottom:12px">המסלול מתנגן כמו סרטון, צבוע לפי מהירות</div>
      <div class="card" style="padding:0;overflow:hidden;position:relative;height:392px;background:#0d1a17">
        <svg id="replay" viewBox="0 0 304 392" width="100%" height="100%" style="display:block"></svg>
        <div style="position:absolute;top:12px;right:14px;background:rgba(11,17,32,.78);border-radius:12px;padding:6px 12px">
          <span class="num" style="font-size:24px;color:var(--rose)">26.4</span> <span class="label">קמ״ש</span>
        </div>
      </div>
      <div class="card" style="display:flex;align-items:center;gap:12px;direction:ltr">
        <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--electric),var(--violet));display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="#fff"/></svg></div>
        <div style="flex:1">
          <div style="height:6px;border-radius:3px;background:var(--surface-hi);position:relative"><i style="position:absolute;left:0;top:0;height:6px;width:46%;border-radius:3px;background:var(--brand)"></i></div>
          <div class="label num" style="display:flex;justify-content:space-between;margin-top:6px;font-weight:500"><span>18:49</span><span>×8</span><span>19:29</span></div>
        </div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="label">מפת חום · איפה הייתי רוב הזמן</div>
        <div class="label" style="margin-top:6px;color:var(--ice)">מתג: מסלול / מפת חום / ספרינטים בלבד</div>
      </div>
    </div>
    <figcaption><b>שידור חוזר</b>כמו בריצת המסלול באפליקציה של OnePlus, מותאם למגרש</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div style="font-size:20px;font-weight:700">ריצה · שלישי 07:42</div>
      <div class="label" style="margin-bottom:14px"><span class="num" style="font-weight:500">5.21 km · 24:12</span></div>
      <div class="tiles">
        <div class="tile"><span class="label">שיא</span><span class="num grad">24.8</span></div>
        <div class="tile"><span class="label">שיא 3 שנ׳</span><span class="num">23.9</span></div>
        <div class="tile"><span class="label">ממוצע</span><span class="num">12.9</span></div>
      </div>
      <div class="card" style="padding:12px 10px 6px">
        <div class="label" style="padding:0 6px 4px">מהירות לאורך זמן · קמ״ש</div>
        <svg id="chart" viewBox="0 0 290 150" width="100%" style="display:block"></svg>
      </div>
      <div class="card">
        <div class="label" style="margin-bottom:4px">דקה-דקה</div>
        <table id="minutes"></table>
      </div>
      <div class="label" style="text-align:center;margin-top:10px">מקור: שעון + טלפון · <span class="num" style="font-weight:500">±0.4</span> קמ״ש · אלגוריתם v1</div>
    </div>
    <figcaption><b>ריצה</b>גרף עם סימון השיא + טבלת דקות</figcaption>
  </figure>
</div>

<script>
  // One synthetic speed series (km/h, one point per 20 s) shared by the run charts.
  const speed = [0, 6, 10.5, 12, 12.4, 12.8, 13.1, 12.6, 12.2, 12.9, 13.4, 13, 12.5, 12.8, 13.6, 14.2, 13.3, 12.7,
    12.4, 12.9, 13.2, 12.8, 12.1, 12.6, 13.9, 17.5, 22.6, 24.8, 23.9, 19.2, 14.1, 12.2, 11.8, 12.4, 12.9, 13.1,
    12.7, 12.3, 12.8, 13.5, 14, 13.2, 12.6, 12.9, 13.3, 12.8, 12.2, 12.5, 13, 13.4, 12.9, 12.4, 12.7, 13.1, 13.6,
    14.4, 15.8, 17.2, 16.1, 13.5, 12.8, 12.3, 12.6, 12.9, 13.2, 12.7, 12.1, 11.6, 10.8, 9.2, 6.5, 2.1, 0];
  const maxI = speed.indexOf(Math.max(...speed));
  const pts = (x0, y0, w, h, top) => speed.map((v, i) => [x0 + (i / (speed.length - 1)) * w, y0 + h - (v / top) * h]);
  const F = 'font-family="Bahnschrift"';

  document.getElementById('spark-watch').setAttribute('points', pts(70, 172, 160, 38, 26).map((p) => p.join(',')).join(' '));

  // Run: speed over time.
  const p = pts(26, 8, 258, 118, 28);
  const line = p.map((q) => q.join(',')).join(' ');
  const grid = [0, 10, 20].map((v) => {
    const y = 8 + 118 - (v / 28) * 118;
    return `<line x1="26" x2="284" y1="${y}" y2="${y}" stroke="#263247" stroke-width="1"/>
            <text x="20" y="${y + 4}" fill="#94A3B8" font-size="10" text-anchor="end" ${F}>${v}</text>`;
  }).join('');
  const [mx, my] = p[maxI];
  document.getElementById('chart').innerHTML = `${grid}
    <polygon points="26,126 ${line} 284,126" fill="#3B82F6" fill-opacity="0.14"/>
    <polyline points="${line}" fill="none" stroke="url(#brand)" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="${mx}" x2="${mx}" y1="${my}" y2="126" stroke="#FB7185" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="${mx}" cy="${my}" r="4.5" fill="#FB7185"/>
    <text x="${mx + 9}" y="${my + 5}" fill="#FB7185" font-size="12" font-weight="700" ${F}>24.8</text>
    ${[0, 6, 12, 18, 24].map((m) => `<text x="${26 + (m / 24) * 258}" y="144" fill="#94A3B8" font-size="10" text-anchor="middle" ${F}>${m}′</text>`).join('')}`;

  const rows = [[8, 12.9, 14.2], [9, 15.6, 24.8], [10, 16.3, 23.9], [11, 12.4, 13.1]];
  document.getElementById('minutes').innerHTML = rows.map(([m, avg, max]) => `<tr>
    <td class="label">דקה <span class="num" style="font-weight:500">${m}</span></td>
    <td style="width:44%"><i style="display:block;height:7px;border-radius:4px;background:#3B82F6;width:${(avg / 26) * 100}%"></i></td>
    <td class="num" style="text-align:left;font-weight:500">${avg.toFixed(1)}</td>
    <td class="num" style="text-align:left;color:${max > 20 ? '#FB7185' : '#F1F5F9'}">${max.toFixed(1)}</td></tr>`).join('');

  // Football: work/rest timeline. Blocks are [minutes, 'w' | 'r'], with spiky speed drawn over the work.
  const blocks = [[3, 'r'], [9, 'w'], [2.5, 'r'], [7, 'w'], [1.5, 'r'], [8, 'w'], [10, 'r'], [9, 'w'], [4, 'r'], [5, 'w']];
  const total = blocks.reduce((s, b) => s + b[0], 0);
  let x = 4, tl = '', seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const [min, kind] of blocks) {
    const w = (min / total) * 292;
    if (kind === 'w') {
      let d = `M${x},66`;
      for (let k = 0; k <= w; k += 3) d += ` L${(x + k).toFixed(1)},${(66 - 8 - rnd() * (rnd() > 0.82 ? 52 : 22)).toFixed(1)}`;
      d += ` L${(x + w).toFixed(1)},66 Z`;
      tl += `<path d="${d}" fill="url(#heat)" fill-opacity=".85"/><rect x="${x}" y="72" width="${w - 2}" height="10" rx="3" fill="#3B82F6"/>`;
    } else {
      tl += `<rect x="${x}" y="72" width="${w - 2}" height="10" rx="3" fill="#475569"/>`;
      if (min >= 4) tl += `<text x="${x + w / 2}" y="60" fill="#94A3B8" font-size="9" text-anchor="middle" ${F}>${min}′</text>`;
    }
    x += w;
  }
  tl += `<text x="4" y="94" fill="#94A3B8" font-size="9" ${F}>18:30</text><text x="296" y="94" fill="#94A3B8" font-size="9" text-anchor="end" ${F}>19:29</text>`;
  document.getElementById('timeline').innerHTML = tl;

  // Football: replay. A pitch outline with a wandering trail coloured by speed.
  const W = 304, H = 392, m = 22;
  let rp = `<rect x="${m}" y="${m}" width="${W - 2 * m}" height="${H - 2 * m}" rx="4" fill="#10231d" stroke="#2b4a40" stroke-width="1.5"/>
    <line x1="${m}" x2="${W - m}" y1="${H / 2}" y2="${H / 2}" stroke="#2b4a40" stroke-width="1.5"/>
    <circle cx="${W / 2}" cy="${H / 2}" r="34" fill="none" stroke="#2b4a40" stroke-width="1.5"/>
    <rect x="${W / 2 - 60}" y="${m}" width="120" height="48" fill="none" stroke="#2b4a40" stroke-width="1.5"/>
    <rect x="${W / 2 - 60}" y="${H - m - 48}" width="120" height="48" fill="none" stroke="#2b4a40" stroke-width="1.5"/>`;
  const heat = ['#22D3EE', '#3B82F6', '#8B5CF6', '#D946EF', '#FB7185'];
  let px = 150, py = 300, ang = -1.2; seed = 11;
  for (let i = 0; i < 150; i++) {
    const burst = (i > 60 && i < 68) || (i > 118 && i < 126);
    const v = burst ? 4 : Math.floor(rnd() * 3.2);
    const step = 3 + v * 3.2;
    ang += (rnd() - 0.5) * (burst ? 0.25 : 1.5);
    let nx = px + Math.cos(ang) * step, ny = py + Math.sin(ang) * step;
    if (nx < m + 14 || nx > W - m - 14) { ang = Math.PI - ang; nx = px; }
    if (ny < m + 14 || ny > H - m - 14) { ang = -ang; ny = py; }
    rp += `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${heat[v]}" stroke-width="${burst ? 4 : 2.6}" stroke-linecap="round" opacity="${0.35 + (i / 150) * 0.65}"/>`;
    px = nx; py = ny;
  }
  rp += `<circle cx="${px}" cy="${py}" r="11" fill="#FB7185" fill-opacity=".25"/><circle cx="${px}" cy="${py}" r="5.5" fill="#fff"/>`;
  document.getElementById('replay').innerHTML = rp;
</script>
</body>
