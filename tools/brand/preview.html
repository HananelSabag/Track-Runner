<!doctype html>
<!-- Contact sheet for eyeballing the generated logo files. Not shipped. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FAST logo preview</title>
<style>
  body { margin: 0; padding: 32px; background: #060a14; font: 14px/1.4 'Segoe UI', sans-serif; color: #94a3b8; }
  .row { display: flex; gap: 28px; align-items: center; margin-bottom: 28px; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 8px; }
  .round { border-radius: 50%; }
  .light { background: #e2e8f0; padding: 20px; border-radius: 16px; }
  .black { background: #000; padding: 20px; border-radius: 16px; }
</style>
</head>
<body>
  <div class="row">
    <figure><img src="../../docs/brand/logo-mark.svg" width="220" height="220"><figcaption>app icon</figcaption></figure>
    <figure><img class="round" src="../../docs/brand/logo-mark.svg" width="220" height="220"><figcaption>app icon — watch launcher mask</figcaption></figure>
    <figure><img src="../../docs/brand/logo-mark-dark.svg" width="220" height="220"><figcaption>mark on navy</figcaption></figure>
    <figure><img class="round" src="../../docs/brand/logo-mark-dark.svg" width="220" height="220"><figcaption>mark on navy — round</figcaption></figure>
  </div>
  <div class="row">
    <figure class="black"><img class="round" src="../../docs/brand/logo-mark.svg" width="48" height="48"> <img class="round" src="../../docs/brand/logo-mark-dark.svg" width="48" height="48"><figcaption>48px on black</figcaption></figure>
    <figure class="light"><img src="../../docs/brand/logo-mark.svg" width="64" height="64"> <img src="../../docs/brand/logo-mark-dark.svg" width="64" height="64"><figcaption>64px on light</figcaption></figure>
    <figure><img src="../../docs/brand/logo-wordmark.svg" height="150"><figcaption>wordmark — dark</figcaption></figure>
    <figure><img src="../../docs/brand/logo-wordmark-light.svg" height="150"><figcaption>wordmark — light</figcaption></figure>
  </div>
</body>
</html>
